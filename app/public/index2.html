<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZRA - Sistem Dialihkan</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="app">
        <!-- Redirect View -->
        <div id="login-view" class="auth-container">
            <div class="auth-card" style="text-align: center;">
                <div class="auth-header" style="margin-bottom: 1.5rem;">
                    <div class="sidebar-logo" style="margin-bottom: 0.5rem; justify-content: center;">
                        <div class="icon"><i class="fas fa-fingerprint"></i></div>
                        <h1
                            style="margin-bottom: 0; background: none; -webkit-text-fill-color: initial; color: inherit;">
                            AZRA <small style="font-size: 0.6rem; opacity: 0.7;">v2.3</small>
                        </h1>
                    </div>
                    <p>Pemberitahuan Pengalihan Sistem</p>
                </div>

                <div style="margin-bottom: 2rem;">
                    <div
                        style="background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1.5rem; color: var(--text);">
                        <i class="fas fa-info-circle"
                            style="color: var(--warning); font-size: 1.5rem; margin-bottom: 0.5rem;"></i>
                        <p style="margin: 0; line-height: 1.5; font-size: 0.95rem;">
                            Layanan GSI Fingerprint Dashboard telah dialihkan ke server <strong
                                style="color: orange;">HO</strong>
                        </p>
                    </div>

                    <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">
                        Klik link berikut <a href="http://10.10.11.5:8080"
                            style="color: orange;">http://10.10.11.5:8080</a>
                        atau tombol di bawah ini untuk login
                    </p>



                    <div
                        style="display: flex; align-items: flex-start; gap: 0.75rem; text-align: left; background: rgba(255, 255, 255, 0.05); padding: 0.875rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.1);">
                        <i class="fas fa-network-wired" style="color: var(--text-muted); margin-top: 0.2rem;"></i>
                        <span style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
                            <strong>Catatan:</strong> Pastikan perangkat Anda terhubung ke <strong
                                style="color: orange;">GSI Corp</strong>
                            agar dapat mengakses sistem tersebut.
                        </span>
                    </div>
                </div>

                <a href="http://10.10.11.5:8080" class="btn-primary"
                    style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem;">
                    Buka Halaman Utama <i class="fas fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
