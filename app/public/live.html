<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Permissions-Policy" content="camera=(self)">
    <title>Live Attendance - AZRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/live.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="live-kiosk-body">
    <main class="live-kiosk-shell">
        <header class="live-kiosk-header">
            <div class="live-brand"><span><i class="fas fa-fingerprint"></i></span><strong>AZRA</strong><small>KIOSK
                    ABSENSI</small></div>
            <div class="live-clock" id="live-clock"></div>
        </header>
        <section class="live-panel live-choice-panel" data-live-root>
            <div class="live-kiosk-heading">
                <div class="live-kicker"><span class="live-pulse"></span> LIVE ATTENDANCE</div>
                <h1>Silakan pilih jenis absensi</h1>
                <p>Pilih Masuk atau Pulang untuk memulai pengenalan wajah.</p>
            </div>
            <div class="live-action-buttons live-choice-buttons"><button class="live-action live-action-in"
                    type="button" data-live-type="0"><i
                        class="fas fa-arrow-right-to-bracket"></i><span><strong>Masuk</strong><small>Mulai
                            bekerja</small></span></button><button class="live-action live-action-out" type="button"
                    data-live-type="1"><i
                        class="fas fa-arrow-right-from-bracket"></i><span><strong>Pulang</strong><small>Selesai
                            bekerja</small></span></button></div>
            <p class="live-privacy"><i class="fas fa-shield-halved"></i> Setelah memilih, Anda akan diarahkan ke halaman
                kamera untuk verifikasi wajah.</p>
        </section>
        <footer class="live-kiosk-footer">Sistem absensi AZRA · Hadir tepat waktu, pulang dengan tenang</footer>
    </main>
    <script type="module">
        import { initLivePage } from './js/live.js';
        initLivePage('kiosk');
        const clock = document.getElementById('live-clock');
        const updateClock = () => { clock.textContent = new Intl.DateTimeFormat('id-ID', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date()); };
        updateClock(); setInterval(updateClock, 1000);
    </script>
</body>

</html>
