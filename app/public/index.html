<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZRA - GSI Fingerprint Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23246196'/><path d='M50 20c-8 0-14 6-14 14 0 2 1 4 2 5l-2 2c-2-2-3-4-3-7 0-9 8-17 17-17s17 8 17 17c0 3-1 5-3 7l-2-2c1-1 2-3 2-5 0-8-6-14-14-14zm0 8c-4 0-7 3-7 7 0 1 0 2 1 3l-2 2c-1-1-2-3-2-5 0-5 4-10 10-10s10 5 10 10c0 2-1 4-2 5l-2-2c1-1 1-2 1-3 0-4-3-7-7-7zm-8 20l-2 2c-1-1-2-3-2-5 0-6 5-11 12-11s12 5 12 11c0 2-1 4-2 5l-2-2c1-1 1-2 1-3 0-4-4-8-9-8s-9 4-9 8c0 1 0 2 1 3zm8-2c-3 0-5 2-5 5v12c0 3 2 5 5 5s5-2 5-5V51c0-3-2-5-5-5z' fill='white'/></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <script type="module">
        async function loadIncludes() {
            const includes = document.querySelectorAll('[data-include]');
            await Promise.all(Array.from(includes).map(async el => {
                try {
                    const res = await fetch(el.getAttribute('data-include'));
                    if (res.ok) {
                        const html = await res.text();
                        const fragment = document.createRange().createContextualFragment(html);
                        el.replaceWith(fragment);
                    }
                } catch (e) {
                    console.error('Error loading include:', e);
                }
            }));

            // Now load the main app.js
            const script = document.createElement('script');
            script.type = 'module';
            script.src = 'app.js';
            document.head.appendChild(script);
        }

        // Dynamic submenu toggle logic
        window.toggleSubMenu = function (menuEl, submenuId) {
            const submenu = document.getElementById(submenuId);
            if (!submenu) return;

            const isOpen = submenu.classList.contains('open');

            // Close all other submenus first (accordion style)
            document.querySelectorAll('.submenu-container').forEach(sub => {
                if (sub.id !== submenuId) {
                    sub.classList.remove('open');
                    sub.style.maxHeight = '0';
                    const parent = sub.previousElementSibling;
                    if (parent) parent.classList.remove('open');
                }
            });

            if (isOpen) {
                submenu.classList.remove('open');
                submenu.style.maxHeight = '0';
                menuEl.classList.remove('open');
            } else {
                submenu.classList.add('open');
                submenu.style.maxHeight = submenu.scrollHeight + 'px';
                menuEl.classList.add('open');
            }
        };

        loadIncludes();
    </script>

</head>

<body>
    <div id="app">
        <!-- Dashboard view (initially hidden) -->
        <div id="dashboard" style="display: none; width: 100%;">
            <!-- Mobile Header -->
            <div class="mobile-header">
                <div class="sidebar-logo" style="margin-bottom: 0;">
                    <div class="icon"><i class="fas fa-fingerprint"></i></div>
                    <span>AZRA <small style="font-size: 0.6rem; opacity: 0.7;">v.3.4</small></span>
                </div>
                <div style="display: flex; gap: 0.75rem; align-items: center;">
                    <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode"
                        style="border: none;">
                        <i class="fas fa-moon"></i>
                    </button>
                    <div class="menu-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </div>
                </div>
            </div>

            <!-- Mobile Overlay -->
            <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

            <nav class="sidebar">
                <div class="sidebar-logo">
                    <div class="icon"><i class="fas fa-fingerprint"></i></div>
                    <span>AZRA <small style="font-size: 0.6rem; opacity: 0.7;">v.3.4</small></span>
                </div>
                <div class="nav-item active" onclick="showPage('overview')">
                    <i class="fas fa-chart-line"></i>
                    <span>Overview</span>
                </div>
                <div class="nav-item" onclick="showPage('devices')">
                    <i class="fas fa-microchip"></i>
                    <span>Devices</span>
                </div>
                <div class="nav-item" onclick="toggleSubMenu(this, 'submenu-employees')">
                    <i class="fas fa-users"></i>
                    <span>Employees</span>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                </div>
                <div id="submenu-employees" class="submenu-container">
                    <div class="nav-item submenu-item" onclick="showPage('employees')">
                        <i class="fas fa-list-ul"></i>
                        <span>List</span>
                    </div>
                    <div class="nav-item submenu-item" onclick="showPage('pull-employee')">
                        <i class="fas fa-download"></i>
                        <span>Pull</span>
                    </div>
                </div>

                <div class="nav-item" onclick="toggleSubMenu(this, 'submenu-attendance')">
                    <i class="fas fa-user-clock"></i>
                    <span>Attendance</span>
                    <i class="fas fa-chevron-down toggle-icon"></i>
                </div>
                <div id="submenu-attendance" class="submenu-container">
                    <div class="nav-item submenu-item" onclick="showPage('logs')">
                        <i class="fas fa-calendar-check"></i>
                        <span>Log</span>
                    </div>
                    <div class="nav-item submenu-item" onclick="showPage('pair')">
                        <i class="fas fa-handshake"></i>
                        <span>Pair</span>
                    </div>
                    <div class="nav-item submenu-item" onclick="showPage('pull')">
                        <i class="fas fa-download"></i>
                        <span>Pull</span>
                    </div>
                </div>
                <div class="nav-item" onclick="showPage('activity')">
                    <i class="fas fa-shield-alt"></i>
                    <span>Activity Log</span>
                </div>
                <div class="nav-item superadmin-only" onclick="showPage('settings')">
                    <i class="fas fa-cog"></i>
                    <span>Settings</span>
                </div>
                <!-- Mobile only logout -->
                <div class="nav-item logout mobile-only-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </div>
            </nav>

            <main class="main-content">
                <!-- Top Navbar / Header -->
                <div class="top-header">
                    <div class="top-header-left">
                        <button class="icon-btn sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="Collapse Sidebar">
                            <i class="fas fa-bars"></i>
                        </button>
                        <div class="header-title" id="page-title">System Overview</div>
                    </div>
                    <div class="top-header-right">
                        <button class="icon-btn theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                            <i class="fas fa-moon"></i>
                        </button>

                        <!-- Compact Logout Button -->
                        <button class="icon-btn logout-btn-compact" onclick="logout()" title="Logout">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>

                <div data-include="pages/overview.html"></div>

                <div data-include="pages/devices.html"></div>

                <div data-include="pages/employees.html"></div>

                <div data-include="pages/logs.html"></div>

                <div data-include="pages/pair.html"></div>

                <div data-include="pages/activity.html"></div>

                <div data-include="pages/pull.html"></div>

                <div data-include="pages/pull-employee.html"></div>

                <div data-include="pages/settings.html"></div>
                <footer class="app-footer">
                    <div>&copy; 2026 AZRA - <strong>GSI Fingerprint Dashboard</strong></div>
                </footer>
            </main>
        </div>

        <!-- Login View -->
        <div data-include="pages/login.html"></div>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h3 id="modal-title" style="margin-bottom: 1.5rem;">Title</h3>
            <div id="modal-content"></div>
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="modal-save-btn">Save Change</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toast-message">Message here</span>
    </div>

</body>

</html>
