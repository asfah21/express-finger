<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Permissions-Policy" content="camera=(self)">
    <title>Verifikasi Wajah - AZRA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/live.css">
</head>

<body class="live-kiosk-body">
    <main class="cam-live-shell">
        <section class="live-panel cam-live-panel" data-cam-live-root>
            <div class="cam-live-header">
                <div>
                    <div class="live-kicker"><span class="live-pulse"></span> VERIFIKASI WAJAH</div>
                    <h1 id="cam-live-title"> </h1>
                    <p id="cam-live-description">Posisikan wajah di tengah bingkai. Pemindaian dilakukan secara otomatis.</p>
                </div>
                <a class="live-back-link" href="/live.html"><i data-icon="arrow-left" aria-hidden="true"></i>
                    Kembali</a>
            </div>
            <div class="cam-live-workspace">
                <div class="live-camera-frame" id="cam-live-camera-frame">
                    <video id="cam-live-video" autoplay muted playsinline aria-label="Pratinjau kamera"></video>
                    <div class="live-face-guide" aria-hidden="true"></div>
                    <!-- <div class="live-camera-processing" id="cam-live-capture"><span></span> Memeriksa wajah…</div> -->
                    <canvas id="cam-live-canvas" hidden></canvas>
                </div>
                <div class="live-actions cam-live-actions">
                    <div class="live-status" id="cam-live-status" role="status" aria-live="polite">Menyiapkan kamera…
                    </div>
                    <button class="live-camera-start" id="cam-live-retry" type="button"><i data-icon="rotate-cw"
                            aria-hidden="true"></i> <span id="cam-live-retry-label">Mulai Scan</span></button>
                    <p class="live-privacy"><i data-icon="shield-check" aria-hidden="true"></i> Gambar hanya dikirim
                        untuk verifikasi dan tidak disimpan di browser.</p>
                </div>
            </div>
            <div class="live-result" id="cam-live-result" role="status" aria-live="assertive" aria-hidden="true">
                <div class="live-result-card">
                    <span class="live-result-icon"><i data-icon="check" aria-hidden="true"></i></span>
                    <small id="cam-live-result-label">Absensi berhasil</small>
                    <strong id="cam-live-result-name">-</strong>
                    <dl class="live-result-meta">
                        <div class="live-result-meta-item">
                            <dt>User ID</dt>
                            <dd id="cam-live-result-userid">-</dd>
                        </div>
                        <div class="live-result-meta-item">
                            <dt>Jabatan</dt>
                            <dd id="cam-live-result-position">-</dd>
                        </div>
                    </dl>
                    <a class="live-result-back" href="/live.html"><i data-icon="arrow-left" aria-hidden="true"></i>
                        Kembali</a>
                </div>
            </div>
        </section>

    </main>

    <script src="js/icon.js"></script>
    <script type="module">
        import { initCamLivePage } from './js/live.js';
        initCamLivePage();
    </script>
</body>

</html>
