<div id="login-view" class="auth-container" style="display: none;">
    <div class="auth-card">
        <div class="auth-header">
            <div class="sidebar-logo" style="margin-bottom: 0.5rem; justify-content: center;">
                <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-fingerprint-pattern-icon lucide-fingerprint-pattern" aria-hidden="true"><use href="/icons/fingerprint-pattern.svg#fingerprint-pattern"></use></svg></div>
                <h1 style="margin-bottom: 0; background: none; -webkit-text-fill-color: initial; color: inherit;">
                    AZRA <small style="font-size: 0.6rem; opacity: 0.7;">v.0.8</small></h1>
            </div>
            <p>GSI Fingerprint Dashboard Login</p>
        </div>
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position: relative;">
                    <input type="password" id="login-password" placeholder="••••••••" required
                        style="padding-right: 3rem;">
                    <button type="button" id="toggle-password-btn" onclick="toggleLoginPassword()"
                        style="position: absolute; right: 0.875rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 0; display: flex; align-items: center; transition: color 0.2s;"
                        onmouseenter="this.style.color='var(--primary)'"
                        onmouseleave="this.style.color='var(--text-muted)'" title="Show/Hide Password">
                        <i class="fas fa-eye" id="toggle-password-icon"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
        </form>
        <div id="login-error"
            style="color: var(--error); font-size: 0.875rem; margin-top: 1rem; text-align: center; display: none;">
        </div>
        <div id="login-info"
            style="margin-top: 1.5rem; padding: 0.75rem; background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 0.75rem; font-size: 0.75rem; color: var(--text-muted); text-align: center; display: none;">
            <i class="fas fa-info-circle" style="color: var(--warning);"></i>
            <span id="login-info-text"></span>
        </div>
    </div>
</div>
