<div id="page-employees" class="page" style="display: none;">

                    <!-- Search and Actions section -->
                    <div
                        style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; background: rgba(255,255,255,0.03); padding: 1.25rem; border-radius: 1rem; border: 1px solid var(--glass-border); margin-bottom: 1.5rem;">
                        <div style="flex: 2; min-width: 250px;">
                            <label
                                style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600;">SEARCH
                                EMPLOYEE</label>
                            <div style="position: relative;">
                                <i class="fas fa-search"
                                    style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                                <input type="text" id="employee-search" placeholder="Search name or user ID..."
                                    style="padding-left: 2.8rem;" oninput="handleEmployeeSearch(this.value)">
                            </div>
                        </div>

                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                            <button class="btn-primary admin-only" style="width: auto; height: 42px; padding: 0 1.2rem;"
                                onclick="openAddEmployee()">
                                <i class="fas fa-plus"></i> Add Employee
                            </button>
                            <button class="btn-primary"
                                style="width: auto; height: 42px; padding: 0 1rem; background: #10b981;"
                                onclick="exportEmployees()">
                                <i class="fas fa-file-excel"></i> Export
                            </button>
                            <button class="btn-primary admin-only"
                                style="width: auto; height: 42px; padding: 0 1rem; background: #f59e0b;"
                                onclick="showImportModal()">
                                <i class="fas fa-file-import"></i> Import
                            </button>
                            <input type="file" id="import-file" style="display: none;" accept=".xlsx, .xls"
                                onchange="handleImport(event)">
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>User ID</th>
                                    <th>NIK</th>
                                    <th>Name</th>
                                    <th>Position</th>
                                    <th>Department</th>
                                    <th>Divisi</th>
                                    <th>Type</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="employees-body"></tbody>
                        </table>
                        <div class="table-footer">
                            <div class="table-info" id="employees-info">Showing 0 of 0 employees</div>
                            <div class="table-pagination">
                                <select onchange="updatePageSize('employees', this.value)">
                                    <option value="25">25 per page</option>
                                    <option value="50">50 per page</option>
                                    <option value="100">100 per page</option>
                                </select>
                                <button onclick="prevPage('employees')" id="employees-prev-btn">Prev</button>
                                <div class="pagination-numbers" id="employees-pagination-numbers"></div>
                                <button onclick="nextPage('employees')" id="employees-next-btn">Next</button>
                            </div>
                        </div>
                    </div>
                </div>
