<div id="page-settings" class="page" style="display: none; padding-bottom: 2rem;">
                    <!-- User Management Section -->
                    <div
                        style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start; margin-bottom: 2rem;">

                        <!-- Add User Card -->
                        <div class="stat-card" style="flex: 1; min-width: 300px; max-width: 400px;">
                            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                                <i class="fas fa-user-plus" style="color: var(--primary);"></i> Add New User
                            </h3>
                            <div class="form-group">
                                <label>Username</label>
                                <input type="text" id="new-user-username" placeholder="e.g. operator1"
                                    autocomplete="off">
                            </div>
                            <div class="form-group">
                                <label>Password <span style="font-size:0.75rem;color:var(--text-muted);">(min. 6
                                        characters)</span></label>
                                <div style="position:relative;">
                                    <input type="password" id="new-user-password" placeholder="••••••••"
                                        style="padding-right:3rem;" autocomplete="new-password">
                                    <button type="button" onclick="toggleNewUserPassword()"
                                        style="position:absolute;right:0.875rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0;display:flex;align-items:center;">
                                        <i class="fas fa-eye" id="new-user-pass-icon"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <label>Role</label>
                                <select id="new-user-role">
                                    <option value="superadmin">superadmin</option>
                                    <option value="admin">admin</option>
                                    <option value="viewer">viewer</option>
                                </select>
                            </div>
                            <button class="btn-primary" style="margin-top:0.5rem;" onclick="addNewUser()">
                                <i class="fas fa-user-plus"></i> Add User
                            </button>
                        </div>

                        <!-- User List Card -->
                        <div class="stat-card" style="flex: 2; min-width: 300px;">
                            <h3
                                style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 0.75rem;">
                                    <i class="fas fa-users-cog" style="color: var(--primary);"></i> Existing Users
                                </div>
                                <button class="icon-btn" onclick="loadUserList()" title="Refresh list"
                                    style="font-size:0.85rem;">
                                    <i class="fas fa-sync-alt"></i>
                                </button>
                            </h3>
                            <div id="user-list-container">
                                <div style="text-align:center;color:var(--text-muted);padding:1.5rem;font-size:0.9rem;">
                                    <i class="fas fa-spinner fa-spin"></i> Loading...
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Page Access Control Section -->
                    <div style="margin-top: 2rem; margin-bottom: 2rem;">
                        <div class="stat-card" style="width: 100%;">
                            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                                <i class="fas fa-lock" style="color: var(--primary);"></i> Page Access Control
                            </h3>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
                                Configure which user roles can view and access each page. 
                                Changes take effect immediately after saving.
                            </p>
                            <div id="page-permissions-container">
                                <div style="text-align:center;color:var(--text-muted);padding:1.5rem;font-size:0.9rem;">
                                    <i class="fas fa-spinner fa-spin"></i> Loading...
                                </div>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start;">
                        <!-- System Config Card -->
                        <div class="stat-card" style="flex: 1; min-width: 300px; max-width: 450px;">
                            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                                <i class="fas fa-sliders-h" style="color: var(--primary);"></i> System Preferences
                            </h3>
                            <div class="form-group">
                                <label>API Key</label>
                                <input type="text" id="setting-api-key" placeholder="Enter API Key">
                            </div>
                            <div class="form-group">
                                <label>Log Cleanup (Days)</label>
                                <input type="number" id="setting-cleanup-days" value="30">
                            </div>
                            <button class="btn-primary" style="margin-top: 1rem;" onclick="saveSystemSettings()">
                                <i class="fas fa-save"></i> Save Config
                            </button>
                        </div>
                    </div>

                </div>
