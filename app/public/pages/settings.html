<div id="page-settings" class="page" style="display: none; padding-bottom: 2rem;">

    <!-- Tab Navigation -->
    <div class="hr-tabs" style="display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 2px solid var(--glass-border); flex-wrap: wrap;">
        <button class="hr-tab active" data-tab="users" data-color="var(--primary)" onclick="switchSettingsTab('users')">
            <i class="fas fa-users-cog"></i>
            <span>Users</span>
        </button>
        <button class="hr-tab" data-tab="access" data-color="var(--warning)" onclick="switchSettingsTab('access')">
            <i class="fas fa-lock"></i>
            <span>Access</span>
        </button>
        <button class="hr-tab" data-tab="system" data-color="var(--secondary)" onclick="switchSettingsTab('system')">
            <i class="fas fa-sliders-h"></i>
            <span>System</span>
        </button>
    </div>

    <!-- Tab Content -->
    <div class="hr-tab-content">

        <!-- Users Tab -->
        <div id="settings-tab-users" class="hr-tab-panel active">
            <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start;">

                <!-- Add User Card -->
                <div class="stat-card" style="flex: 1; min-width: 300px; max-width: 400px;">
                    <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                        <i class="fas fa-user-plus" style="color: var(--primary);"></i> Add New User
                    </h3>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="new-user-username" placeholder="e.g. operator1"
                            autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Password <span style="font-size:0.75rem;color:var(--text-muted);">(min. 6
                                characters)</span></label>
                        <div style="position:relative;">
                            <input type="password" id="new-user-password" placeholder="••••••••"
                                style="padding-right:3rem;" autocomplete="new-password">
                            <button type="button" onclick="toggleNewUserPassword()"
                                style="position:absolute;right:0.875rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0;display:flex;align-items:center;">
                                <i class="fas fa-eye" id="new-user-pass-icon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="new-user-role">
                            <option value="superadmin">superadmin</option>
                            <option value="admin">admin</option>
                            <option value="viewer">viewer</option>
                        </select>
                    </div>
                    <button class="btn-primary" style="margin-top:0.5rem;" onclick="addNewUser()">
                        <i class="fas fa-user-plus"></i> Add User
                    </button>
                </div>

                <!-- User List Card -->
                <div class="stat-card" style="flex: 2; min-width: 300px;">
                    <h3
                        style="margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <i class="fas fa-users-cog" style="color: var(--primary);"></i> Existing Users
                        </div>
                        <button class="icon-btn" onclick="loadUserList()" title="Refresh list"
                            style="font-size:0.85rem;">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </h3>
                    <div id="user-list-container">
                        <div style="text-align:center;color:var(--text-muted);padding:1.5rem;font-size:0.9rem;">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Access Tab -->
        <div id="settings-tab-access" class="hr-tab-panel">
            <div class="stat-card" style="width: 100%;">
                <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                    <i class="fas fa-lock" style="color: var(--warning);"></i> Page Access Control
                </h3>
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem;">
                    Configure which user roles can view and access each page. 
                    Changes take effect immediately after saving.
                </p>
                <div id="page-permissions-container">
                    <div style="text-align:center;color:var(--text-muted);padding:1.5rem;font-size:0.9rem;">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </div>
                </div>
            </div>
        </div>

        <!-- System Tab -->
        <div id="settings-tab-system" class="hr-tab-panel">
            <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start;">
                <!-- System Preferences Card -->
                <div class="stat-card" style="flex: 1; min-width: 300px; max-width: 450px;">
                    <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                        <i class="fas fa-sliders-h" style="color: var(--secondary);"></i> System Preferences
                    </h3>
                    <div class="form-group">
                        <label>API Key</label>
                        <input type="text" id="setting-api-key" placeholder="Enter API Key">
                    </div>
                    <div class="form-group">
                        <label>Log Cleanup (Days)</label>
                        <input type="number" id="setting-cleanup-days" value="30">
                    </div>
                    <button class="btn-primary" style="margin-top: 1rem;" onclick="saveSystemSettings()">
                        <i class="fas fa-save"></i> Save Config
                    </button>
                </div>

                <!-- Auto Sync Employee Card -->
                <div class="stat-card" style="flex: 1; min-width: 300px; max-width: 450px;">
                    <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                        <i class="fas fa-cloud-download-alt" style="color: var(--primary);"></i> Auto Sync Employee
                    </h3>
                    <!-- <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.5;">
                        Automatically pull employee data from a fingerprint device 
                        and sync to server database on a scheduled interval.
                    </p> -->

                    <!-- Device Selector -->
                    <div class="form-group">
                        <label>Fingerprint Device</label>
                        <div style="position: relative;">
                            <i class="fas fa-fingerprint" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); z-index: 1;"></i>
                            <select id="setting-auto-sync-device" style="padding-left: 2.8rem;">
                                <option value="">-- Select Device --</option>
                            </select>
                        </div>
                        <!-- <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem;">
                            <i class="fas fa-info-circle"></i> Choose which device to pull employee data from
                        </div> -->
                    </div>
                    
                    <!-- Toggle Switch -->
                    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid var(--glass-border); margin-bottom: 1rem;">
                        <div>
                            <!-- <div style="font-weight: 600; font-size: 0.9rem;">Enable Auto Sync</div> -->
                            <div style="font-size: 0.75rem; color: var(--text-muted);">Sync employee data automatically</div>
                        </div>
                        <label class="toggle-switch" style="position: relative; display: inline-block; width: 48px; height: 26px; flex-shrink: 0;">
                            <input type="checkbox" id="setting-auto-sync-employee">
                            <span class="toggle-slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.15); border-radius: 26px; transition: 0.3s;"></span>
                        </label>
                    </div>

                    <!-- Interval Setting -->
                    <div class="form-group">
                        <label>Sync Interval (Minutes)</label>
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="number" id="setting-auto-sync-interval" value="30" min="5" max="1440" style="flex: 1;">
                            <span style="font-size: 0.8rem; color: var(--text-muted); white-space: nowrap;">min (5 - 1440)</span>
                        </div>
                        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.3rem;">
                            <i class="fas fa-info-circle"></i> Recommended: 30-60 minutes
                        </div>
                    </div>

                    <!-- Status Indicator -->
                    <div id="auto-sync-status" style="display: none; margin-top: 0.75rem; padding: 0.5rem 0.75rem; border-radius: 0.5rem; font-size: 0.8rem;">
                    </div>

                    <button class="btn-primary" style="margin-top: 1rem;" onclick="saveAutoSyncSettings()">
                        <i class="fas fa-save"></i> Save Auto Sync
                    </button>
                </div>
            </div>
        </div>

    </div>

</div>
