<div id="page-user" class="page" style="display: none; padding-bottom: 2rem;">
    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start;">
        <!-- My Account Card -->
        <div class="stat-card" style="flex: 1; min-width: 300px; max-width: 500px;">
            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                <i class="fas fa-user-shield" style="color: var(--secondary);"></i> My Account
            </h3>
            <div class="form-group">
                <label>New Username</label>
                <input type="text" id="profile-username" placeholder="Leave empty to keep current">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="profile-password" placeholder="••••••••">
            </div>
            <button class="btn-primary" style="background: var(--secondary); margin-top: 1rem;" onclick="updateAccount()">
                <i class="fas fa-user-edit"></i> Update Profile
            </button>
        </div>
    </div>
</div>
