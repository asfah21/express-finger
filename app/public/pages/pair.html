<div id="page-pair" class="page" style="display: none;">

    <!-- Filter and Search section -->
    <div class="filter-bar">
        <div class="filter-group" style="flex: 2; min-width: 250px;">
            <label class="filter-label">SEARCH EMPLOYEE</label>
            <div class="search-input-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="pair-search" placeholder="Search name, NIK, or ID..."
                    class="search-input" oninput="handlePairSearch(this.value)">
            </div>
        </div>

        <div class="filter-group" style="flex: 1; min-width: 140px;">
            <label class="filter-label">FROM DATE</label>
            <input type="date" id="pair-date-from" onchange="handlePairDateChange()">
        </div>

        <div class="filter-group" style="flex: 1; min-width: 140px;">
            <label class="filter-label">TO DATE</label>
            <input type="date" id="pair-date-to" onchange="handlePairDateChange()">
        </div>

        <div class="filter-group" style="flex: 1; min-width: 150px;">
            <label class="filter-label">DEPARTMENT</label>
            <select id="pair-department" onchange="handlePairDepartmentChange(this.value)">
                <option value="all">All Departments</option>
            </select>
        </div>

        <div class="filter-group" style="flex: 1; min-width: 150px;">
            <label class="filter-label">STATUS</label>
            <select id="pair-status" onchange="handlePairStatusChange(this.value)">
                <option value="all">All Status</option>
                <option value="hadir_penuh">Hadir Penuh</option>
                <option value="sedang_bekerja">Sedang Bekerja</option>
                <option value="tidak_absen_pulang">Tidak Absen Pulang</option>
                <option value="tidak_absen_masuk">Tidak Absen Masuk</option>
                <option value="tidak_hadir">Tidak Hadir</option>
            </select>
        </div>        

        <div class="filter-actions">
            <button class="btn-primary filter-btn btn-export" onclick="showPairExportMenu()">
                <i class="fas fa-file-export"></i> Export
            </button>
        </div>
    </div>

    <!-- Summary chips: quick glance at who's missing which leg -->
    <div class="pair-summary-chips" id="pair-summary-chips">
        <span class="badge badge-success"><i class="fas fa-user-check"></i> Hadir Penuh: <b id="pair-count-hadir">0</b></span>
        <span class="badge badge-info"><i class="fas fa-user-clock"></i> Sedang Bekerja: <b id="pair-count-bekerja">0</b></span>
        <span class="badge badge-warning"><i class="fas fa-user-clock"></i> Tidak Absen Pulang: <b id="pair-count-pulang">0</b></span>
        <span class="badge badge-primary"><i class="fas fa-user-times"></i> Tidak Absen Masuk: <b id="pair-count-masuk">0</b></span>
        <span class="badge badge-error"><i class="fas fa-user-times"></i> Tidak Hadir: <b id="pair-count-tidak">0</b></span>
    </div>

    <div class="table-container">
        <table id="pair-table">
            <thead>
                <tr>
                    <th>NIK</th>
                    <th>Name</th>
                    <th>Dept - Position</th>
                    <th>Date</th>
                    <th>IN</th>
                    <th>OUT</th>
                    <th>Work Hours</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="pair-body"></tbody>
        </table>
        <div class="table-footer">
            <div class="table-info" id="pair-info">Showing 0 of 0 items</div>
            <div class="table-pagination">
                <select onchange="updatePairPageSize(this.value)">
                    <option value="25">25 per page</option>
                    <option value="50">50 per page</option>
                    <option value="100">100 per page</option>
                </select>
                <button onclick="prevPairPage()" id="pair-prev-btn">Prev</button>
                <div class="pagination-numbers" id="pair-pagination-numbers"></div>
                <button onclick="nextPairPage()" id="pair-next-btn">Next</button>
            </div>
        </div>
    </div>
</div>
