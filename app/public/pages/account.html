<div id="page-account" class="page" style="display: none; padding-bottom: 2rem;">
    <div style="display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: flex-start;">
        <!-- Profile Info Card -->
        <div class="stat-card" style="flex: 1; min-width: 280px; max-width: 360px; text-align: center; padding: 2rem 1.5rem;">
            <div style="width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--secondary), #8fc45a); margin: 0 auto 1rem; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #fff; box-shadow: 0 8px 24px rgba(119, 160, 68, 0.3);" id="profile-avatar">
                <span id="profile-avatar-letter">U</span>
            </div>
            <h3 style="margin: 0 0 0.25rem; font-size: 1.25rem; color: var(--text);" id="profile-display-name">-</h3>
            <div style="display: inline-block; padding: 0.25rem 0.75rem; border-radius: 1rem; font-size: 0.75rem; font-weight: 600; background: rgba(119, 160, 68, 0.15); color: var(--secondary);" id="profile-role-badge">-</div>
            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--glass-border); text-align: left;">
                <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; font-size: 0.85rem;">
                    <span style="color: var(--text-muted);">Username</span>
                    <span style="color: var(--text); font-weight: 500;" id="profile-username-label">-</span>
                </div>
                <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; font-size: 0.85rem;">
                    <span style="color: var(--text-muted);">Role</span>
                    <span style="color: var(--text); font-weight: 500;" id="profile-role-label">-</span>
                </div>
            </div>
        </div>

        <!-- Update Profile Card -->
        <div class="stat-card" style="flex: 2; min-width: 300px; max-width: 500px;">
            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;">
                <i class="fas fa-user-edit" style="color: var(--secondary);"></i> Update Profile
            </h3>
            <div class="form-group">
                <label>New Username</label>
                <input type="text" id="profile-username" placeholder="Leave empty to keep current">
            </div>
            <div class="form-group">
                <label>New Password <span style="font-size:0.75rem;color:var(--text-muted);">(min. 6 characters)</span></label>
                <div style="position:relative;">
                    <input type="password" id="profile-password" placeholder="••••••••"
                        style="padding-right:3rem;" autocomplete="new-password">
                    <button type="button" onclick="toggleProfilePassword()"
                        style="position:absolute;right:0.875rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0;display:flex;align-items:center;">
                        <i class="fas fa-eye" id="profile-pass-icon"></i>
                    </button>
                </div>
            </div>
            <button class="btn-primary" style="background: var(--secondary); margin-top: 0.5rem;" onclick="updateAccount()">
                <i class="fas fa-save"></i> Update Profile
            </button>
        </div>
    </div>
</div>
