<div id="page-pull-employee" class="page" style="display: none;">
    <!-- Standard Filter & Action Bar -->
    <div
        style="display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: flex-end; background: rgba(255,255,255,0.03); padding: 1.25rem; border-radius: 1rem; border: 1px solid var(--glass-border); margin-bottom: 1.5rem;">

        <!-- Device Selector -->
        <div style="flex: 2; min-width: 250px;">
            <label
                style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; font-weight: 600; text-transform: uppercase;">DEVICE
                SOURCE</label>
            <div style="position: relative;">
                <i class="fas fa-fingerprint"
                    style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                <select id="pull-employee-device-select" onchange="updateEmployeeDeviceStatus(this.value)"
                    style="padding-left: 2.8rem; height: 42px;">
                    <option value="">-- Select Fingerprint Device --</option>
                </select>
            </div>
        </div>

        <!-- Action Buttons -->
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
            <button class="btn-primary" id="btn-pull-employee-preview"
                style="width: auto; height: 42px; padding: 0 1.2rem;"
                onclick="pullEmployeeDataFromDevice('preview')">
                <i class="fas fa-search"></i> Preview
            </button>
            <button class="btn-primary admin-only" id="btn-pull-employee-sync"
                style="width: auto; height: 42px; padding: 0 1.2rem; background: var(--secondary);"
                onclick="showSyncModal()">
                <i class="fas fa-cloud-download-alt"></i> Pull & Sync
            </button>
            <button class="btn-primary" id="btn-export-pull-employee"
                style="width: auto; height: 42px; padding: 0 1rem; background: #10b981; display: none;"
                onclick="exportPulledEmployeeData()">
                <i class="fas fa-file-csv"></i> Export
            </button>
            <button class="btn-primary" id="btn-download-raw-employee"
                style="width: auto; height: 42px; padding: 0 1rem; background: #6b7280; display: none;"
                onclick="downloadRawEmployeeData()">
                <i class="fas fa-file-code"></i> JSON
            </button>
        </div>
    </div>

    <!-- Progress Bar -->
    <div id="pull-employee-progress-wrap" style="display: none; margin-top: 1.25rem;">
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span id="pull-employee-progress-label"
                style="font-size: 0.8rem; color: var(--text-muted);">Initializing...</span>
            <span id="pull-employee-progress-pct"
                style="font-size: 0.8rem; font-weight: 600; color: var(--primary);">0%</span>
        </div>
        <div
            style="background: rgba(255,255,255,0.06); border-radius: 999px; height: 10px; overflow: hidden; border: 1px solid var(--glass-border);">
            <div id="pull-employee-progress-bar"
                style="height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.6s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 8px rgba(36,97,150,0.5);">
            </div>
        </div>
        <!-- Stage Indicators -->
        <div style="display: flex; justify-content: space-between; margin-top: 0.75rem; gap: 0.5rem;">
            <div class="pull-stage" id="emp-stage-connect"
                style="flex:1; text-align:center; font-size:0.7rem; padding: 0.35rem 0.5rem; border-radius: 0.4rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); color: var(--text-muted); transition: all 0.3s;">
                <i class="fas fa-plug" style="display:block; margin-bottom:2px;"></i> Connect
            </div>
            <div class="pull-stage" id="emp-stage-fetch"
                style="flex:1; text-align:center; font-size:0.7rem; padding: 0.35rem 0.5rem; border-radius: 0.4rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); color: var(--text-muted); transition: all 0.3s;">
                <i class="fas fa-users" style="display:block; margin-bottom:2px;"></i> Fetch Users
            </div>
            <div class="pull-stage" id="emp-stage-process"
                style="flex:1; text-align:center; font-size:0.7rem; padding: 0.35rem 0.5rem; border-radius: 0.4rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); color: var(--text-muted); transition: all 0.3s;">
                <i class="fas fa-cogs" style="display:block; margin-bottom:2px;"></i> Process
            </div>
            <div class="pull-stage" id="emp-stage-done"
                style="flex:1; text-align:center; font-size:0.7rem; padding: 0.35rem 0.5rem; border-radius: 0.4rem; background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); color: var(--text-muted); transition: all 0.3s;">
                <i class="fas fa-check" style="display:block; margin-bottom:2px;"></i> Done
            </div>
        </div>
        <p id="pull-employee-eta"
            style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.6rem; text-align: center;">
        </p>
    </div>

    <div id="pull-employee-status"
        style="margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; display: none; font-size: 0.875rem; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border);">
    </div>

    <!-- Results Section (Tabs & Table) -->
    <div id="pull-employee-results-container" style="display: none; margin-top: 1rem;">
        <!-- Header & Tabs -->
        <div
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
            <h3 style="margin: 0; font-size: 1.1rem; color: var(--text); font-weight: 700;">
                <i class="fas fa-users" style="color: var(--primary); margin-right: 0.5rem;"></i>
                Preview Result
            </h3>
            <div
                style="display: flex; gap: 0.5rem; background: rgba(255,255,255,0.05); padding: 0.25rem; border-radius: 0.5rem; border: 1px solid var(--glass-border);">
                <button onclick="switchPullEmployeeView('list')" id="tab-emp-list"
                    style="padding: 0.4rem 1.2rem; border-radius: 0.35rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; background: var(--primary); color: white; transition: all 0.2s;">
                    <i class="fas fa-list"></i> User List
                </button>
                <button onclick="switchPullEmployeeView('summary')" id="tab-emp-summary"
                    style="padding: 0.4rem 1.2rem; border-radius: 0.35rem; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: all 0.2s;">
                    <i class="fas fa-chart-pie"></i> Summary
                </button>
            </div>
        </div>

        <!-- The Main Result Card -->
        <div class="table-container">
            <!-- User List table -->
            <div id="view-emp-list">
                <table>
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Name</th>
                            <th>Fingerprint</th>
                            <th>Card</th>
                            <th>Role</th>
                        </tr>
                    </thead>
                    <tbody id="pull-employee-list-body"></tbody>
                </table>
            </div>

            <!-- Summary view -->
            <div id="view-emp-summary" style="display: none;">
                <div style="padding: 1rem;">
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                        <div class="stat-card" style="background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); border-radius: 0.75rem; padding: 1.25rem; text-align: center;">
                            <div style="font-size: 2rem; font-weight: 700; color: #10b981;" id="emp-summary-total">0</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">Total Users</div>
                        </div>
                        <div class="stat-card" style="background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 0.75rem; padding: 1.25rem; text-align: center;">
                            <div style="font-size: 2rem; font-weight: 700; color: #3b82f6;" id="emp-summary-with-fp">0</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">With Fingerprint</div>
                        </div>
                        <div class="stat-card" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 0.75rem; padding: 1.25rem; text-align: center;">
                            <div style="font-size: 2rem; font-weight: 700; color: #ef4444;" id="emp-summary-no-fp">0</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">No Fingerprint</div>
                        </div>
                        <div class="stat-card" style="background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 0.75rem; padding: 1.25rem; text-align: center;">
                            <div style="font-size: 2rem; font-weight: 700; color: #a855f7;" id="emp-summary-total-fp">0</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem;">Total Fingerprints</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Footer -->
            <div class="table-footer">
                <div class="table-info" id="pull-employee-results-info">Showing 0-0 of 0</div>
                <div class="table-pagination">
                    <select onchange="updatePullEmployeePageSize(this.value)">
                        <option value="25">25 per page</option>
                        <option value="50">50 per page</option>
                        <option value="100">100 per page</option>
                    </select>
                    <button onclick="prevPullEmployeePage()" id="pull-employee-prev-btn">Prev</button>
                    <div class="pagination-numbers" id="pull-employee-pagination-numbers"></div>
                    <button onclick="nextPullEmployeePage()" id="pull-employee-next-btn">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sync Mode Modal (uses generic modal overlay from index.html) -->
    <div id="sync-modal-content" style="display: none;">
        <p style="color: var(--text-muted); margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.5;">
            Select how you want to synchronize employee data:
        </p>
        <div style="display: flex; flex-direction: column; gap: 1rem;">
            <button onclick="pullEmployeeDataFromDevice('sync', 'device-to-server')" 
                class="sync-option-btn"
                style="display: flex; align-items: center; gap: 1rem; padding: 1.25rem; border-radius: 0.75rem; border: 2px solid var(--glass-border); background: var(--card-bg); cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; color: var(--text);"
                onmouseover="this.style.borderColor='#3b82f6'; this.style.background='rgba(59,130,246,0.08)';"
                onmouseout="this.style.borderColor='var(--glass-border)'; this.style.background='var(--card-bg)';">
                <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(59, 130, 246, 0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i class="fas fa-cloud-download-alt" style="font-size: 1.3rem; color: #3b82f6;"></i>
                </div>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-weight: 700; font-size: 1rem; margin-bottom: 0.25rem;">Device → Server</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Pull employee data from fingerprint device and save to server database</div>
                </div>
                <i class="fas fa-chevron-right" style="flex-shrink: 0; color: var(--text-muted);"></i>
            </button>

            <button onclick="pullEmployeeDataFromDevice('sync', 'server-to-device')" 
                class="sync-option-btn"
                style="display: flex; align-items: center; gap: 1rem; padding: 1.25rem; border-radius: 0.75rem; border: 2px solid var(--glass-border); background: var(--card-bg); cursor: pointer; transition: all 0.2s; text-align: left; width: 100%; color: var(--text);"
                onmouseover="this.style.borderColor='#10b981'; this.style.background='rgba(16,185,129,0.08)';"
                onmouseout="this.style.borderColor='var(--glass-border)'; this.style.background='var(--card-bg)';">
                <div style="width: 48px; height: 48px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                    <i class="fas fa-cloud-upload-alt" style="font-size: 1.3rem; color: #10b981;"></i>
                </div>
                <div style="flex: 1; min-width: 0;">
                    <div style="font-weight: 700; font-size: 1rem; margin-bottom: 0.25rem;">Server → Device</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Push employee data from server database to fingerprint device</div>
                </div>
                <i class="fas fa-chevron-right" style="flex-shrink: 0; color: var(--text-muted);"></i>
            </button>
        </div>
    </div>
</div>
