services:
  express-finger:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    container_name: express-finger
    restart: unless-stopped
    network_mode: "host"
    environment:
      - PGUSER=your_username
      - PGPASSWORD=your_password
      - PGHOST=127.0.0.1
      - PGDATABASE=your_database
      - PGPORT=5432
      - API_KEY=your_api_key
      - JWT_SECRET=your-strong-random-secret-key-min-32-chars
      - RAW_DIR=/data/raw
      - CORS_ORIGINS= # Daftar origin yang diizinkan, pisah koma. Contoh: https://app.example.com,https://admin.example.com
    volumes:
      - ./data/raw:/data/raw
    working_dir: /app
    command: ["node", "server.js"]
